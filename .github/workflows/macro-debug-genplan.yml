name: Macro debug genplan (one-off)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/macro-debug-genplan.yml'
      - 'scripts/macro-debug-genplan.mjs'
permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/macro-debug-genplan.mjs
        env:
          MACRO_API_KEY: ${{ secrets.MACRO_API_KEY }}
      - run: |
          git config user.name "debug-bot"
          git config user.email "debug-bot@users.noreply.github.com"
          git add macro-genplan-debug.json
          git commit -m "Debug: genplan data dump [skip ci]" || echo "nothing to commit"
          git push
