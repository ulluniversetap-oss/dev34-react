name: Macro debug list (one-off)

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/macro-debug-list.mjs
        env:
          MACRO_API_KEY: ${{ secrets.MACRO_API_KEY }}
